<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NODE7 - Character Select</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="body">
    <div id="main" class="main-wrap">
        <div class="topbar">
            <div class="title">NODE7 CHARSELECT</div>
            <button id="refresh" class="refresh" type="button">Refresh</button>
        </div>

        <div id="characters" class="characters"></div>
        <div id="message" class="message"></div>
    </div>

    <aside id="creator" class="creator-panel">
        <div class="creator-head">
            <div class="creator-title" id="creatorTitle">Create Character</div>
            <button id="cancelBtn" class="close-panel" type="button">Back</button>
        </div>

        <input type="hidden" id="slot" value="">
        <input type="hidden" id="citizenid" value="">

        <div class="form-grid">
            <label>First Name<input type="text" id="name" placeholder="Arthur" required maxlength="50" autocomplete="off"></label>
            <label>Last Name<input type="text" id="lastname" placeholder="Morgan" required maxlength="50" autocomplete="off"></label>
            <label>Birthdate<input type="text" id="birthdate" placeholder="1870-01-01" required maxlength="20" autocomplete="off"></label>
            <label>Gender<select id="gender" required><option value="male">Male</option><option value="female">Female</option></select></label>
            <label>Nationality<input type="text" id="nationality" placeholder="American" required maxlength="50" autocomplete="off"></label>
            <label>Backstory<textarea id="backstory" placeholder="Optional" maxlength="500"></textarea></label>
        </div>

        <div class="creator-actions">
            <button id="createBtn" class="create2" type="button">Create</button>
        </div>
    </aside>

    <div id="remover"></div>

    <script src="js/listener.js" type="text/javascript"></script>
</body>
</html>
